[package]
name = "owlrscon"
version = "0.1.0"
edition = "2024"
default-run = "owlrscon"

[features]
default = ["wgpu"]
cpu = ["cubecl/cpu", "sift-cubecl/cpu"]
cuda = ["cubecl/cuda", "sift-cubecl/cuda", "dep:cudarc"]
wgpu = ["cubecl/wgpu", "sift-cubecl/wgpu"]

[dependencies]
cubecl = { version = "0.10" }
cudarc = { version = "0.19", features = ["driver"], optional = true }
image = "0.25.10"
imageproc = "0.25"
indicatif = "0.17"
nalgebra = "0.33"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sift-cubecl = { git = "https://github.com/Akimaylilll/sift-cubecl", default-features = false }
sysinfo = "0.38"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }
